
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英地典 - Chinese-English Dictionary of UK Place Names</title>
  <style>
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    #search {
      flex: 1;
      min-width: 0;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #search::-webkit-search-cancel-button,
    #search::-webkit-search-decoration,
    #search::-webkit-search-results-button,
    #search::-webkit-search-results-decoration {
      display: none;
    }

    .toggle-button {
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      background-color: #eeeeee;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      width: 100px;
      text-align: center;
      transition: background-color 0.2s;
    }

    .toggle-button:hover {
      background-color: #d6d6d6;
    }

    .results {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .entry {
      position: relative;
      width: 100%;
      background: white;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      line-height: 1.6;
    }

    .action-buttons {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      background: #eeeeee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 4px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .action-btn:hover {
      background-color: #d6d6d6;
    }

    .action-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .tags {
      margin-top: 0.5rem;
    }

    .tag {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 0.2rem 0.5rem;
      margin-right: 0.3rem;
      border-radius: 4px;
      font-size: 0.8rem;
      position: relative;
    }

    .tag.rarer {
      background-color: #e74c3c;
    }

    .tag.ydd {
      background-color: #f39c12;
    }

    .tag.archaic {
      background-color: #e74c3c;
    }

    .tag::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 0;
      bottom: 125%;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: normal;
      z-index: 1000;
      display: none;
      max-width: 220px;
      width: max-content;
    }

    .tag:hover::after {
      display: block;
    }

      .controls {
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 0.5rem;
      }

      #search {
        flex: 1;
      }

      .toggle-button {
        width: auto;
      }
    }
  </style>
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <div class="container">
    <div class="heading">
      <div class="title-cn">英地典</div>
      <div class="title-en">Chinese-English<br>Dictionary of UK Place Names</div>
    </div>

<div class="navbar">
    <a href="index.html" class="nav-button">Search</a>
    <a href="https://github.com/elliottjonestw/yingdidian" class="nav-button">Submit</a>
    <a href="updates.html" class="nav-button">Updates</a>
</div>

    <div class="controls">
      <input type="text" id="search" placeholder="Coventry" autocomplete="off" />
      <button id="toggle-script" class="toggle-button">Simplified</button>
    </div>

    <div class="results" id="results"></div>
  </div>

  <div class="footer">
    A project by <a href="https://elliottjones.net">Elliott Jones</a>. Please <a href="https://github.com/elliottjonestw/yingdidian">help contribute</a>.
  </div>

  <script>
    let data = [];
    let showTraditional = false;

    window.addEventListener('DOMContentLoaded', () => {
      fetch('https://raw.githubusercontent.com/elliottjonestw/yingdidian/refs/heads/main/dictionary.csv')
        .then(response => response.text())
        .then(csv => {
          data = parseCSV(csv);
          displayResults(filterData());
        });

      document.getElementById('search').addEventListener('input', () => {
        displayResults(filterData());
      });

      document.getElementById('toggle-script').addEventListener('click', () => {
        showTraditional = !showTraditional;
        document.getElementById('toggle-script').textContent = showTraditional ? 'Traditional' : 'Simplified';
        displayResults(filterData());
      });
    });

    function parseCSV(csv) {
      const [headerLine, ...lines] = csv.trim().split('\n');
      const headers = headerLine.split(',').map(h => h.trim());

      return lines.map(line => {
        const values = line.split(',').map(v => v.trim());
        const entry = {};
        headers.forEach((h, i) => entry[h] = values[i] || '');
        return entry;
      });
    }

    function normalize(str) {
      return str
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/\s+/g, '')
        .toLowerCase();
    }

    function filterData() {
      let query = document.getElementById('search').value.trim();
      if (query === '') query = 'coventry';
      query = normalize(query);

      return data.filter(row =>
        Object.values(row).some(val =>
          normalize(val).includes(query)
        )
      );
    }

    function displayResults(entries) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      entries.forEach(entry => {
        const box = document.createElement('div');
        box.className = 'entry';

        const script = showTraditional ? entry.traditional : entry.simplified;

        const actions = document.createElement('div');
        actions.className = 'action-buttons';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.innerHTML = '<img src="copy.png" alt="Copy">';
        copyBtn.title = 'Copy to clipboard';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(script);
        });

        const searchBtn = document.createElement('button');
        searchBtn.className = 'action-btn';
        searchBtn.innerHTML = '<img src="search.png" alt="Search">';
        searchBtn.title = 'Search on Google';
        searchBtn.addEventListener('click', () => {
          const url = `https://www.google.com/search?q="${encodeURIComponent(script)}"`;
          window.open(url, '_blank');
        });

        actions.appendChild(copyBtn);
        actions.appendChild(searchBtn);

        box.innerHTML = `
          <strong>${entry.english}</strong><br/>
          <span>${script}</span><br/>
          <em>${entry.pinyin}</em>
        `;

        const tags = document.createElement('div');
        tags.className = 'tags';
        if (entry['tw-specific'].toLowerCase() === 'true') {
          tags.innerHTML += `<span class="tag" data-tooltip='This word has been marked as "Taiwan Variant", meaning it is used primarily by people and organizations from Taiwan, and is not the standard for people and organizations from mainland China.'>Taiwan Variant</span>`;
        }
        if (entry['rarer-alternative'].toLowerCase() === 'true') {
          tags.innerHTML += `<span class="tag rarer" data-tooltip='This word has been marked as "Rare Variant", meaning it is not the primary Chinese translation for this word in mainland China or Taiwan. You may still see it used in some places, but its use in new content is not recommended.'>Rare Variant</span>`;
        }
        if (entry['yingdidian-named'] && entry['yingdidian-named'].toLowerCase() === 'true') {
          tags.innerHTML += `<span class="tag ydd" data-tooltip='This word has been marked as "英地典-Named", meaning prior to the creation of this entry, there was no known Chinese translation for it. In an effort to standardize future translations of this word, we have created a phonetically accurate translation which you can use.'>英地典-Named</span>`;
        }
        if (entry['archaic'] && entry['archaic'].toLowerCase() === 'true') {
          tags.innerHTML += `<span class="tag archaic" data-tooltip='This word has been marked as "Archaic", meaning it is no longer in use. Although it may appear in historic texts, its use in new content is not recommended.'>Archaic</span>`;
        }

        box.appendChild(actions);
        box.appendChild(tags);
        container.appendChild(box);
      });
    }
  </script>
</body>
</html>
