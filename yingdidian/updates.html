<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英地典 - Recent Updates</title>
  <style>
    .commit-history-wrapper {
      margin-top: 2rem;
      text-align: center;
    }

    .commit {
      margin: 0.5rem 0;
    }

    .commit a {
      text-decoration: none;
      color: #0366d6;
      font-weight: bold;
    }
  </style>
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <div class="container">
    <div class="heading">
      <div class="title-cn">英地典</div>
      <div class="title-en">Chinese-English<br>Dictionary of UK Place Names</div>
    </div>

    <div class="navbar">
      <a href="index.html" class="nav-button">Search</a>
      <a href="https://github.com/elliottjonestw/yingdidian" class="nav-button">Submit</a>
      <a href="updates.html" class="nav-button">Updates</a>
    </div>

    <div class="commit-history-wrapper">
      <h3>Recent Updates</h3>
      <div id="commit-history">Loading...</div>
    </div>

  </div>

<div class="footer">
      A project by <a href="https://elliottjones.net">Elliott Jones</a>. Please <a href="#">help contribute</a>.
    </div>

  <script>
  const apiUrl = 'https://api.github.com/repos/elliottjonestw/yingdidian/commits?path=dictionary.csv';

  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('commit-history');
      container.innerHTML = '';

      data
        .filter(commit => commit.commit.message.trim().toLowerCase() !== 'initial commit')
        .slice(0, 10)
        .forEach(commit => {
          const div = document.createElement('div');
          div.classList.add('commit');

          const sha = commit.sha.substring(0, 7);
          const url = commit.html_url;
          const msg = commit.commit.message;
          const author = commit.commit.author.name;
          const date = new Date(commit.commit.author.date).toLocaleString();

          div.innerHTML = `
            <a href="${url}" target="_blank">${sha}</a> – ${msg}<br>
            <small>by ${author} on ${date}</small>
          `;
          container.appendChild(div);
        });
    })
    .catch(error => {
      document.getElementById('commit-history').innerHTML = 'Failed to load commit history.';
      console.error(error);
    });
</script>

</body>
</html>
