name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # GA4 data is compiled into the static site once an hour. Avoid the top of
  # the hour, when GitHub may delay scheduled workflows during high load.
  schedule:
    - cron: '17 * * * *'
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports the origin and base path Pages is actually serving: the project
      # sub-path today, "/" once a custom domain is set in the repo settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Sync public GA4 page-view counts
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:page-views

      - name: Build site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
