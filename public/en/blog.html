<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting — Elliott Jones</title>
    <!-- Canonical points at the blog these URLs used to serve. -->
    <link rel="canonical" href="https://elliottjones.net/blog" />
    <!-- Relative so this works whether the site is served from an apex domain
         or from a GitHub Pages project sub-path. -->
    <meta http-equiv="refresh" content="0; url=../blog" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>This page has moved. <a href="../blog">Continue to the blog</a>.</p>
    <script>location.replace("../blog");</script>
  </body>
</html>
