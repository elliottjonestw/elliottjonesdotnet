<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting — Elliott Jones</title>
    <!-- Canonical points at the final home of the site. -->
    <link rel="canonical" href="https://elliottjones.net/#work" />
    <!-- Relative so this works whether the site is served from an apex domain
         or from a GitHub Pages project sub-path. -->
    <meta http-equiv="refresh" content="0; url=../#work" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>This page has moved. <a href="../#work">Continue to elliottjones.net</a>.</p>
    <script>location.replace("../#work");</script>
  </body>
</html>
